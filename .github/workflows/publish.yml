name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish via npm Trusted Publishing (OIDC)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          node -e '
            const [maj, min, pat] = require("child_process")
              .execSync("npm --version", { encoding: "utf8" })
              .trim()
              .split(".")
              .map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            console.log(`Detected npm ${maj}.${min}.${pat} (OIDC ready: ${ok})`);
            process.exit(ok ? 0 : 1);
          ' || npm install -g npm@latest

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const pkg = require("./package.json");
            const expected = `v${pkg.version}`;
            const actual = process.env.RELEASE_TAG;
            if (actual !== expected) {
              console.error(`Release tag ${actual} does not match package.json version ${expected}`);
              process.exit(1);
            }
            console.log(`Verified tag ${actual} matches package.json`);
          '

      - name: Run unit tests
        run: npm test

      - name: Publish to npm (tokenless OIDC + provenance)
        run: npm publish --provenance --access public
