name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Run unit tests
        run: npm test

      - name: Verify CLI preview, stats, monitor, config & proxy smoke tests
        run: |
          node bin/agy-bar.mjs preview --width 112 --scenario all --plain
          node bin/agy-bar.mjs stats 7d --plain
          node bin/agy-bar.mjs monitor --once --plain
          node bin/agy-bar.mjs config show
          node bin/agy-bar.mjs proxy status --json
          node bin/agy-bar.mjs proxy env
